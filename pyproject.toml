[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "click>=8.1,<9",
]

[project.scripts]
pulse = "pulse.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]
